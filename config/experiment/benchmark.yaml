# @package _global_
defaults:
  - override /data/feature_config: base_equivariant_n320

data:
  dataset_path: resources/benchmark.zarr
  dataset:
    repeat: 1000
  dataloader:
    num_workers: 0
    persistent_workers: false
    shuffle: false
    prefetch_factor: null

trainer:
  max_epochs: -1
  max_steps: 5000
  callbacks:
    - _target_: equicast.callbacks.step_timer.StepTimer

logger:
  experiment_name: benchmark
