variables:
  forcing:
    - cos_latitude
    - cos_longitude
  diagnostic:
    - t2m
    - msl
  prognostic:
    - sp

dataset:
  _target_: equicast.dataset.AnemoiDataset
  path: /home/masc/remote/data/era5_anemoi.zarr
  variables: ${variables}
  graph_provider:
    _target_: equicast.graph.graph_provider.StaticGraphProvider
    path: ./graph/graph.pt

model:
  _target_: equicast.model.simple.Simple
  variables: ${variables}
  # _target_: equicast.model.from_checkpoint
  # model_class: equicast.model.simple.Simple
  # checkpoint_provider:
  #   _target_: equicast.checkpoint.MLFlowCheckpointProvider
  #   tracking_uri: https://mlflow.dmidev.org/
  #   run_id: 6b1df7f1d616435883cf3b672cb8f7ba
  #   checkpoint_name: latest

trainer:
  _target_: equicast.trainer.trainer.Trainer
  max_epochs: 1
  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      every_n_epochs: 1
      save_top_k: 1
      filename: "latest"
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      every_n_epochs: 1
      save_top_k: 1
      mode: min
      monitor: loss
      filename: "minloss"

optimizer:
  _target_: torch.optim.Adam
  lr: 0.001

scheduler: null
logger:
  # _target_: pytorch_lightning.loggers.mlflow.MLFlowLogger
  _target_: equicast.logger.mlflow.MLFlowLogger
  experiment_name: masc
  tracking_uri: https://mlflow.dmidev.org/
