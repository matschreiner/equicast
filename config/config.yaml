defaults:
  - model: simple
  - variables: base
  - _self_

dataset:
  _target_: equicast.dataset.AnemoiDataset
  path: /home/masc/storage/mini_aifs.zarr
  variables: ${variables}
  graph_provider:
    _target_: equicast.graph.graph_provider.StaticGraphProvider
    path: ./graph/aifs-graph.pt

trainer:
  _target_: equicast.trainer.Trainer
  max_epochs: 30
  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      every_n_epochs: 1
      save_top_k: 1
      filename: "latest"
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      every_n_epochs: 1
      save_top_k: 1
      mode: min
      monitor: loss
      filename: "minloss"

optimizer:
  _target_: torch.optim.Adam
  lr: 0.001

scheduler: null
logger:
  _target_: equicast.logger.mlflow.MLFlowLogger
  experiment_name: masc
  tracking_uri: https://mlflow.dmidev.org/
