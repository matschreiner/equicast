# @package _global_
defaults:
  - override /data: o96
  - override /model/backbone: painn_big
  - override /model/data_handler: multiframe
  - override /optimization/scheduler: cosine

model:
  data_handler:
    n_input_frames: 2

data:
  dataset:
    no_frames: 3
  dataloader:
    batch_size: 1

optimization:
  optimizer:
    lr: 1.0e-3
  scheduler:
    warmup_steps: 3200
    total_steps: 161500

logger:
  tracking_uri: experiments/07_painn_big/mlflow
  experiment_name: painn_big

trainer:
  callbacks:
    - _target_: equicast.callbacks.checkpoint.TimeDeltaCheckpoint
    - _target_: equicast.callbacks.step_timer.StepTimer
    - _target_: equicast.callbacks.memory_monitor.MemoryMonitor
