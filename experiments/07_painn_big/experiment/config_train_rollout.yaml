# @package _global_
defaults:
  - override /data: o96
  - override /model/backbone: painn_big
  - override /model/data_handler: multiframe
  - override /optimization/scheduler: cosine

model:
  backbone:
    edges:
      - [data, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, hidden]
      - [hidden, to, data]
  data_handler:
    n_input_frames: 2
  loss:
    _target_: equicast.model.losses.WeightedEquivariantMSELoss
    variable_weights:
      z: 12.0
      t: 6.0
      sp: 10.0
      q: 0.6
      tp: 0.025
      cp: 0.0025

data:
  dataset:
    no_frames: 3
  dataloader:
    batch_size: 1

rollout:
  n_steps: 2

optimization:
  optimizer:
    lr: 3.0e-4
  scheduler:
    warmup_steps: 1000
    total_steps: 60000

ckpt_path: experiments/07_painn_big/mlflow/584878801972728078/95e7cd6502ca42f28f46d84d011b0527/artifacts/checkpoints/latest.ckpt
weights_only: true

logger:
  tracking_uri: experiments/07_painn_big/mlflow
  experiment_name: painn_big_rollout

trainer:
  callbacks:
    - _target_: equicast.callbacks.checkpoint.TimeDeltaCheckpoint
    - _target_: equicast.callbacks.step_timer.StepTimer
    - _target_: equicast.callbacks.memory_monitor.MemoryMonitor
