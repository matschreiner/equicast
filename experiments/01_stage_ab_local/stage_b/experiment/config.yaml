# @package _global_
defaults:
  - override /data: n320
  - override /model/backbone: painn
  - override /model/data_handler: multiframe
  - override /optimization/scheduler: cosine

model:
  backbone:
    hidden_dim: 200
  data_handler:
    n_input_frames: 2

data:
  dataset:
    no_frames: 3

logger:
  tracking_uri: experiments/01_stage_ab_local/mlflow
  experiment_name: stage_b

ckpt_path: experiments/01_stage_ab_local/mlflow/989249639477683992/cc8c0a0221444dffaa029e177926879f/artifacts/checkpoints/latest.ckpt
weights_only: true

optimization:
  scheduler:
    warmup_steps: 3000

trainer:
  callbacks:
    - _target_: equicast.callbacks.checkpoint.TimeDeltaCheckpoint
    - _target_: equicast.callbacks.step_timer.StepTimer
    - _target_: equicast.callbacks.memory_monitor.MemoryMonitor
