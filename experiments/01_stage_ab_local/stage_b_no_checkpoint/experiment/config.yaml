# @package _global_
defaults:
  - override /data: n320
  - override /model/backbone: painn_wide

logger:
  tracking_uri: experiments/01_stage_ab_local/mlflow
  experiment_name: stage_b_no_checkpoint

trainer:
  max_steps: 5000
  callbacks:
