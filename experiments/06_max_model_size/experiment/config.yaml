# @package _global_
defaults:
  - override /data: n320
  - override /model/backbone: painn_wide
  - override /model/data_handler: multiframe

model:
  backbone:
    hidden_dim: 256
  data_handler:
    n_input_frames: 2

data:
  dataset:
    no_frames: 3

logger:
  tracking_uri: experiments/06_max_model_size/mlflow
  experiment_name: max_model_size

trainer:
  max_steps: 5
  enable_checkpointing: false
  callbacks:
    - _target_: equicast.callbacks.memory_monitor.MemoryMonitor
