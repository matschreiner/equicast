# @package _global_
# N320 training with FSDP across 2 GPUs.
# Shards model parameters + gradients + optimizer states across GPUs so each
# GPU only holds half the model — needed for hidden_dim=512 on N320.
#
# Use: python scripts/train.py --config-dir experiments/12_n320 experiment=config_fsdp
defaults:
  - config
  - _self_

model:
  backbone:
    gradient_checkpointing: false  # FSDP handles activation checkpointing — avoid double recompute

logger:
  experiment_name: n320_fsdp

trainer:
  strategy:
    _target_: pytorch_lightning.strategies.FSDPStrategy
    auto_wrap_policy:
      _target_: torch.distributed.fsdp.wrap.ModuleWrapPolicy
      module_classes:
        - equicast.model.backbones.painn.PaiNNBlock
    activation_checkpointing_policy:
      _target_: torch.distributed.fsdp.wrap.ModuleWrapPolicy
      module_classes:
        - equicast.model.backbones.painn.PaiNNBlock
    cpu_offload: false
  devices: auto
