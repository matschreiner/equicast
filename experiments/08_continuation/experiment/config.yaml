# @package _global_
defaults:
  - override /model/backbone: painn_minimal
  - override /optimization/scheduler: cosine

optimization:
  optimizer:
    lr: 1.0e-3
  scheduler:
    warmup_steps: 25
    total_steps: 100

logger:
  tracking_uri: experiments/08_continuation/mlflow

trainer:
  max_steps: 50
  callbacks:
    - _target_: equicast.callbacks.checkpoint.TimeDeltaCheckpoint
